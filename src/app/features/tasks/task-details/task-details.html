@if (task(); as task) {
  <div>
    <h1>{{ task.title }} - {{ task.id }}</h1>
    <p>{{ task.description }}</p>
    <div>
      <p>{{ task.status }}</p>
      @if (canAdvanceStatus()) {
        <button (click)="moveToNextStatus(task.id)">Next Status</button>
      }
    </div>
    <p>{{ task.assignee }}</p>
  </div>
}
